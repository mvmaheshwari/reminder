<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Command Board</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#182129">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Command Board">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EEF0F2;
    --ink:#182129;
    --ink-soft:#5B6570;
    --card:#FFFFFF;
    --line:#DEE2E6;
    --line-soft:#E8EAED;
    --accent:#2E7D6B;

    --cat-personal:#7C6FDC;
    --cat-management:#2E7D6B;
    --cat-surat:#C2703D;
    --cat-saarthi:#3B6FA0;
    --cat-anc:#B5495B;
    --cat-roundtable:#93841F;

    --high:#B5495B;
    --medium:#C2903D;
    --low:#5B7A63;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Inter',sans-serif;
    background:var(--bg);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1080px;
    margin:0 auto;
    padding:28px 20px 60px;
  }
  h1,h2,h3{font-family:'Space Grotesk',sans-serif; margin:0;}
  .mono{font-family:'IBM Plex Mono',monospace;}

  /* HEADER */
  header{
    display:flex; align-items:flex-end; justify-content:space-between;
    margin-bottom:22px; flex-wrap:wrap; gap:14px;
  }
  .brand-eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.14em;
    text-transform:uppercase; color:var(--ink-soft); margin-bottom:4px;
  }
  header h1{font-size:26px; font-weight:700; letter-spacing:-.01em;}
  .today-badge{
    background:var(--card); border:1px solid var(--line); border-radius:10px;
    padding:10px 16px; text-align:right;
  }
  .today-badge .d{font-family:'IBM Plex Mono',monospace; font-size:13px; color:var(--ink-soft);}
  .today-badge .n{font-family:'Space Grotesk',sans-serif; font-size:20px; font-weight:700;}
  .sync-status{
    font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);
    margin-top:5px; display:flex; align-items:center; gap:5px; justify-content:flex-end;
    cursor:pointer;
  }
  .sync-status .dot{width:6px; height:6px; border-radius:50%; background:var(--low);}
  .sync-status.err .dot{background:var(--high);}
  .sync-status.pending .dot{background:var(--medium);}
  .setup-banner{
    font-family:'IBM Plex Mono',monospace; font-size:12px; line-height:1.6; color:#7A4A17;
    background:#FDF1DE; border:1px solid #F0DAB2; border-radius:10px;
    padding:14px 16px; margin-bottom:18px;
  }
  .setup-banner code{background:#F5E2C0; padding:1px 5px; border-radius:4px;}

  /* LAYOUT */
  .grid{
    display:grid;
    grid-template-columns: 340px 1fr;
    gap:20px;
  }
  @media (max-width:820px){ .grid{grid-template-columns:1fr;} }

  .panel{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    padding:18px;
  }

  /* CALENDAR */
  .cal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;}
  .cal-head .month{font-family:'Space Grotesk',sans-serif; font-weight:600; font-size:16px;}
  .cal-nav{display:flex; gap:6px;}
  .cal-nav button{
    width:28px; height:28px; border-radius:7px; border:1px solid var(--line);
    background:var(--bg); cursor:pointer; font-size:14px; color:var(--ink);
    display:flex; align-items:center; justify-content:center;
  }
  .cal-nav button:hover{background:var(--line-soft);}
  .cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
  .cal-dow{
    font-family:'IBM Plex Mono',monospace; font-size:10px; text-transform:uppercase;
    color:var(--ink-soft); text-align:center; padding-bottom:4px;
  }
  .cal-day{
    aspect-ratio:1; border-radius:8px; border:1px solid transparent;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    cursor:pointer; position:relative; font-size:13px; gap:3px;
    background:var(--bg);
  }
  .cal-day.muted{opacity:.35; cursor:default;}
  .cal-day:hover:not(.muted){border-color:var(--line);}
  .cal-day.today{font-weight:700; color:var(--accent);}
  .cal-day.selected{background:var(--ink); color:#fff;}
  .cal-day.selected .cal-dots span{outline:1px solid #fff;}
  .cal-dots{display:flex; gap:2px; height:5px;}
  .cal-dots span{width:5px; height:5px; border-radius:50%; display:inline-block;}

  /* STATS */
  .stats{margin-top:18px;}
  .stats h3{font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:10px; font-family:'IBM Plex Mono',monospace; font-weight:500;}
  .stat-row{display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:12.5px;}
  .stat-dot{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .stat-name{flex:1; color:var(--ink-soft);}
  .stat-count{font-family:'IBM Plex Mono',monospace; font-weight:500;}

  /* MAIN COLUMN */
  .cat-tabs{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:16px;}
  .cat-tab{
    padding:7px 13px; border-radius:20px; border:1px solid var(--line);
    background:var(--card); font-size:12.5px; cursor:pointer; color:var(--ink-soft);
    display:flex; align-items:center; gap:6px; font-weight:500;
  }
  .cat-tab .dot{width:7px; height:7px; border-radius:50%;}
  .cat-tab.active{background:var(--ink); color:#fff; border-color:var(--ink);}
  .cat-tab.active .dot{outline:1px solid #fff;}

  .day-header{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  .day-header .sel-date{font-family:'Space Grotesk',sans-serif; font-size:19px; font-weight:700;}
  .day-header .sel-sub{font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--ink-soft);}

  .add-form{
    display:grid; grid-template-columns: 1fr auto auto auto; gap:8px; margin-bottom:18px;
  }
  @media (max-width:640px){ .add-form{grid-template-columns:1fr 1fr; } }
  .add-form input[type=text], .add-form select{
    border:1px solid var(--line); border-radius:8px; padding:9px 10px;
    font-family:'Inter',sans-serif; font-size:13px; background:var(--bg); color:var(--ink);
  }
  .add-form button{
    border:none; border-radius:8px; background:var(--ink); color:#fff;
    font-size:13px; font-weight:600; padding:9px 16px; cursor:pointer;
    font-family:'Inter',sans-serif;
  }
  .add-form button:hover{opacity:.88;}

  .task-list{display:flex; flex-direction:column; gap:8px;}
  .task-row{
    display:flex; align-items:center; gap:12px; padding:11px 12px;
    border:1px solid var(--line-soft); border-radius:10px; background:var(--bg);
  }
  .task-row.done{opacity:.5;}
  .task-row.done .t-title{text-decoration:line-through;}
  .chk{
    width:26px; height:26px; border-radius:7px; border:1.5px solid var(--ink-soft);
    cursor:pointer; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    background:var(--card); font-size:14px;
  }
  .chk.checked{background:var(--accent); border-color:var(--accent); color:#fff; font-size:14px;}
  .t-title{flex:1; font-size:14px; font-weight:500; min-width:0; word-break:break-word;}
  .t-meta{display:flex; align-items:center; gap:8px; flex-shrink:0;}
  .t-cat{
    font-family:'IBM Plex Mono',monospace; font-size:10px; padding:3px 8px; border-radius:20px;
    color:#fff; text-transform:uppercase; letter-spacing:.03em; white-space:nowrap;
  }
  .t-pri{width:8px; height:8px; border-radius:50%; flex-shrink:0;}
  .t-del{
    background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:18px;
    padding:6px 8px; line-height:1; flex-shrink:0; min-width:32px; min-height:32px;
  }
  .t-del:hover{color:var(--high);}
  .empty{
    text-align:center; padding:36px 10px; color:var(--ink-soft); font-size:13px;
  }
  .sync-banner{
    font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:#8A5A1B;
    background:#FDF1DE; border:1px solid #F0DAB2; border-radius:8px;
    padding:8px 12px; margin-bottom:16px;
  }
  .email-btn{
    border:1px solid var(--line); border-radius:8px; background:var(--card);
    color:var(--ink); font-size:12px; font-weight:600; padding:8px 14px;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .email-btn:hover{background:var(--line-soft);}
  .email-btn:disabled{opacity:.6; cursor:default;}
  .email-status{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--ink-soft);
    margin-top:6px; max-width:220px;
  }
  .overdue-flag{
    font-family:'IBM Plex Mono',monospace; font-size:9.5px; color:var(--high);
    background:rgba(181,73,91,0.1); padding:2px 6px; border-radius:5px; flex-shrink:0;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div>
      <div class="brand-eyebrow">Command Board</div>
      <h1>Your day, across every venture</h1>
    </div>
    <div class="today-badge">
      <div class="d" id="todayLabel"></div>
      <div class="n" id="todayCompletion">0/0 done today</div>
      <div class="sync-status" id="syncStatus" onclick="loadTasks()" title="Click to refresh from the sheet">syncing...</div>
    </div>
  </header>
  <div id="setupBanner" class="setup-banner" style="display:none;"></div>
  <div id="syncBanner" class="sync-banner" style="display:none;"></div>

  <div class="grid">
    <div class="left-col">
      <div class="panel">
        <div class="cal-head">
          <div class="month" id="calMonth"></div>
          <div class="cal-nav">
            <button onclick="shiftMonth(-1)">&#8249;</button>
            <button onclick="goToday()">&#9679;</button>
            <button onclick="shiftMonth(1)">&#8250;</button>
          </div>
        </div>
        <div class="cal-grid" id="calDow"></div>
        <div class="cal-grid" id="calGrid" style="margin-top:4px;"></div>
        <div class="stats">
          <h3>Open Workload</h3>
          <div id="statList"></div>
        </div>
      </div>
    </div>

    <div class="right-col">
      <div class="panel">
        <div class="cat-tabs" id="catTabs"></div>
        <div class="day-header">
          <div>
            <div class="sel-date" id="selDateLabel"></div>
            <div class="sel-sub" id="selDateSub"></div>
          </div>
          <div style="text-align:right;">
            <button id="emailBtn" class="email-btn" onclick="draftEmailSummary()">Draft Email Summary</button>
            <div id="emailStatus" class="email-status"></div>
          </div>
        </div>

        <div class="add-form">
          <input type="text" id="newTitle" placeholder="What needs doing...">
          <select id="newCat"></select>
          <select id="newPri">
            <option value="high">High</option>
            <option value="medium" selected>Medium</option>
            <option value="low">Low</option>
          </select>
          <button onclick="addTask()">Add</button>
        </div>

        <div class="task-list" id="taskList"></div>
      </div>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script>
const CATEGORIES = [
  {id:'personal', name:'Personal', color:'var(--cat-personal)'},
  {id:'management', name:'Management', color:'var(--cat-management)'},
  {id:'surat', name:'Surat Business', color:'var(--cat-surat)'},
  {id:'saarthi', name:'Saarthi', color:'var(--cat-saarthi)'},
  {id:'anc', name:'ANC', color:'var(--cat-anc)'},
  {id:'roundtable', name:'Round Table', color:'var(--cat-roundtable)'},
];
const PRI_ORDER = {high:0, medium:1, low:2};
const PRI_COLOR = {high:'var(--high)', medium:'var(--medium)', low:'var(--low)'};

let tasks = [];
let viewMonth = new Date();
let selectedDate = todayISO();
let activeCat = 'all';

function todayISO(){
  const d = new Date();
  return isoOf(d);
}
function isoOf(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function catInfo(id){ return CATEGORIES.find(c=>c.id===id) || CATEGORIES[0]; }

// ============================================================
// CLOUD SYNC — backend settings now live entirely in config.js,
// so updating your Apps Script URL/token never touches this
// file (no redeploy of the app logic needed).
// ============================================================
const CFG = window.APP_CONFIG || {};
const APPS_SCRIPT_URL = CFG.APPS_SCRIPT_URL || '';
const SYNC_TOKEN = CFG.SYNC_TOKEN || '';
const POLL_INTERVAL_MS = CFG.POLL_INTERVAL_MS || 20000;

let syncAvailable = true;
let pollTimer = null;

function showBanner(msg){
  const b = document.getElementById('syncBanner');
  if(!msg){ b.style.display='none'; return; }
  b.textContent = msg;
  b.style.display = 'block';
}

function showSetupBanner(msg){
  const b = document.getElementById('setupBanner');
  if(!msg){ b.style.display='none'; return; }
  b.innerHTML = msg;
  b.style.display = 'block';
}

function setSyncStatus(state){
  const el = document.getElementById('syncStatus');
  const now = new Date().toLocaleTimeString('en-US',{hour:'numeric', minute:'2-digit'});
  el.classList.remove('err','pending');
  if(state==='ok'){
    el.innerHTML = '<span class="dot"></span>Synced '+now;
  }else if(state==='pending'){
    el.classList.add('pending');
    el.innerHTML = '<span class="dot"></span>Syncing...';
  }else if(state==='err'){
    el.classList.add('err');
    el.innerHTML = '<span class="dot"></span>Not synced (tap to retry)';
  }else if(state==='off'){
    el.classList.add('err');
    el.innerHTML = '<span class="dot"></span>Not configured';
  }
}

function isConfigured(){
  return APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes('PASTE_YOUR')
    && SYNC_TOKEN && !SYNC_TOKEN.includes('PASTE_YOUR');
}
async function cloudGet(key){
  const url = APPS_SCRIPT_URL + '?action=get&key=' + encodeURIComponent(key) + '&token=' + encodeURIComponent(SYNC_TOKEN);
  const res = await fetch(url);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
  return data.value;
}

async function cloudSet(key, value){
  // text/plain avoids a CORS preflight, which Apps Script web apps don't handle.
  const res = await fetch(APPS_SCRIPT_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({token: SYNC_TOKEN, key, value})
  });
  if(!res.ok) throw new Error('HTTP '+res.status);
  const data = await res.json();
  if(data.error) throw new Error(data.error);
}

async function loadTasks(preserveEditing){
  if(!isConfigured()){
    syncAvailable = false;
    tasks = tasks.length ? tasks : [];
    setSyncStatus('off');
    showSetupBanner('<b>Cloud sync isn\'t set up yet.</b><br>Open <code>config.js</code> (not this file) and fill in <code>APPS_SCRIPT_URL</code> and <code>SYNC_TOKEN</code> from your Apps Script deployment. Until then, tasks only last for this browser session.');
    rollOverdue();
    render();
    startPolling();
    return;
  }
  showSetupBanner(null);
  // Don't yank focus away from the input field while someone is mid-typing on a poll refresh.
  if(preserveEditing && document.activeElement && document.activeElement.id==='newTitle' && document.activeElement.value){
    return;
  }
  setSyncStatus('pending');
  try{
    const raw = await cloudGet('tasks');
    tasks = raw ? JSON.parse(raw) : [];
    syncAvailable = true;
    setSyncStatus('ok');
    showBanner(null);
  }catch(e){
    syncAvailable = false;
    console.error('cloud load failed', e);
    setSyncStatus('err');
    showBanner('Could not reach the Google Sheet backend (' + e.message + '). Showing the last data loaded in this browser.');
  }
  rollOverdue();
  render();
  startPolling();
}

async function saveTasks(){
  if(!isConfigured()){
    syncAvailable = false;
    setSyncStatus('off');
    return;
  }
  setSyncStatus('pending');
  const attempt = () => cloudSet('tasks', JSON.stringify(tasks));
  try{
    await attempt();
    syncAvailable = true;
    setSyncStatus('ok');
    showBanner(null);
  }catch(e){
    try{
      await new Promise(r=>setTimeout(r, 700));
      await attempt();
      syncAvailable = true;
      setSyncStatus('ok');
      showBanner(null);
    }catch(e2){
      syncAvailable = false;
      console.error('cloud save failed after retry', e2);
      setSyncStatus('err');
      showBanner('Couldn\'t save to the sheet just now (' + e2.message + '). Your change is kept here — tap the sync status to retry.');
    }
  }
}

function startPolling(){
  if(pollTimer) clearInterval(pollTimer);
  if(!isConfigured()) return;
  pollTimer = setInterval(()=>{
    if(document.visibilityState === 'visible') loadTasks(true);
  }, POLL_INTERVAL_MS);
}
window.addEventListener('focus', ()=>{ if(isConfigured()) loadTasks(true); });

function rollOverdue(){
  const t = todayISO();
  let changed = false;
  tasks.forEach(task=>{
    if(!task.done && task.date < t){
      task.date = t;
      task.rolled = true;
      changed = true;
    }
  });
  if(changed) saveTasks();
}

function addTask(){
  const titleEl = document.getElementById('newTitle');
  const title = titleEl.value.trim();
  if(!title) return;
  const cat = document.getElementById('newCat').value;
  const pri = document.getElementById('newPri').value;
  tasks.push({
    id: 'tk_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),
    title, category:cat, priority:pri,
    date: selectedDate, done:false, rolled:false
  });
  titleEl.value='';
  saveTasks();
  render();
}

function toggleDone(id){
  const t = tasks.find(x=>x.id===id);
  if(!t) return;
  t.done = !t.done;
  if(t.done) t.rolled = false;
  saveTasks();
  render();
}

function deleteTask(id){
  tasks = tasks.filter(x=>x.id!==id);
  saveTasks();
  render();
}

function shiftMonth(n){
  viewMonth.setMonth(viewMonth.getMonth()+n);
  renderCalendar();
}
function goToday(){
  viewMonth = new Date();
  selectedDate = todayISO();
  render();
}
function selectDate(iso){
  selectedDate = iso;
  render();
}
function setCat(id){
  activeCat = id;
  render();
}

function renderHeader(){
  const d = new Date();
  document.getElementById('todayLabel').textContent = d.toLocaleDateString('en-US',{weekday:'long', month:'short', day:'numeric'});
  const todays = tasks.filter(t=>t.date===todayISO());
  const done = todays.filter(t=>t.done).length;
  document.getElementById('todayCompletion').textContent = done+'/'+todays.length+' done today';
}

function renderCalendar(){
  const dowRow = document.getElementById('calDow');
  dowRow.innerHTML = ['S','M','T','W','T','F','S'].map(d=>'<div class="cal-dow">'+d+'</div>').join('');

  document.getElementById('calMonth').textContent = viewMonth.toLocaleDateString('en-US',{month:'long', year:'numeric'});

  const year = viewMonth.getFullYear(), month = viewMonth.getMonth();
  const firstDay = new Date(year, month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(year, month+1, 0).getDate();
  const t = todayISO();

  let html = '';
  for(let i=0;i<startOffset;i++){
    html += '<div class="cal-day muted"></div>';
  }
  for(let day=1; day<=daysInMonth; day++){
    const iso = year+'-'+String(month+1).padStart(2,'0')+'-'+String(day).padStart(2,'0');
    const dayTasks = tasks.filter(x=>x.date===iso && !x.done);
    const cats = [...new Set(dayTasks.map(x=>x.category))].slice(0,4);
    let cls = 'cal-day';
    if(iso===t) cls += ' today';
    if(iso===selectedDate) cls += ' selected';
    const dots = cats.map(c=>'<span style="background:'+catInfo(c).color+'"></span>').join('');
    html += '<div class="'+cls+'" onclick="selectDate(\''+iso+'\')"><div>'+day+'</div><div class="cal-dots">'+dots+'</div></div>';
  }
  document.getElementById('calGrid').innerHTML = html;
}

function renderStats(){
  const open = tasks.filter(t=>!t.done);
  const list = document.getElementById('statList');
  list.innerHTML = CATEGORIES.map(c=>{
    const count = open.filter(t=>t.category===c.id).length;
    return '<div class="stat-row"><span class="stat-dot" style="background:'+c.color+'"></span><span class="stat-name">'+c.name+'</span><span class="stat-count">'+count+'</span></div>';
  }).join('');
}

function renderCatTabs(){
  const el = document.getElementById('catTabs');
  let html = '<div class="cat-tab'+(activeCat==='all'?' active':'')+'" onclick="setCat(\'all\')"><span class="dot" style="background:var(--ink-soft)"></span>All</div>';
  html += CATEGORIES.map(c=>
    '<div class="cat-tab'+(activeCat===c.id?' active':'')+'" onclick="setCat(\''+c.id+'\')"><span class="dot" style="background:'+c.color+'"></span>'+c.name+'</div>'
  ).join('');
  el.innerHTML = html;

  const sel = document.getElementById('newCat');
  sel.innerHTML = CATEGORIES.map(c=>'<option value="'+c.id+'">'+c.name+'</option>').join('');
}

function renderDayHeader(){
  const d = new Date(selectedDate+'T00:00:00');
  document.getElementById('selDateLabel').textContent = d.toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const isToday = selectedDate===todayISO();
  document.getElementById('selDateSub').textContent = isToday ? 'Today' : (selectedDate < todayISO() ? 'Past' : 'Upcoming');
}

function renderTaskList(){
  let dayTasks = tasks.filter(t=>t.date===selectedDate);
  if(activeCat!=='all') dayTasks = dayTasks.filter(t=>t.category===activeCat);
  dayTasks.sort((a,b)=>{
    if(a.done!==b.done) return a.done?1:-1;
    return PRI_ORDER[a.priority]-PRI_ORDER[b.priority];
  });

  const el = document.getElementById('taskList');
  if(dayTasks.length===0){
    el.innerHTML = '<div class="empty">Nothing here yet. Add something above.</div>';
    return;
  }
  el.innerHTML = dayTasks.map(t=>{
    const c = catInfo(t.category);
    return '<div class="task-row'+(t.done?' done':'')+'">'
      + '<div class="chk'+(t.done?' checked':'')+'" onclick="toggleDone(\''+t.id+'\')">'+(t.done?'&#10003;':'')+'</div>'
      + '<div class="t-title">'+escapeHtml(t.title)+'</div>'
      + '<div class="t-meta">'
      + (t.rolled && !t.done ? '<span class="overdue-flag">carried over</span>' : '')
      + '<span class="t-pri" style="background:'+PRI_COLOR[t.priority]+'" title="'+t.priority+' priority"></span>'
      + '<span class="t-cat" style="background:'+c.color+'">'+c.name+'</span>'
      + '<button class="t-del" onclick="deleteTask(\''+t.id+'\')">&times;</button>'
      + '</div></div>';
  }).join('');
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

function render(){
  renderHeader();
  renderCalendar();
  renderStats();
  renderCatTabs();
  renderDayHeader();
  renderTaskList();
}

document.getElementById('newTitle').addEventListener('keydown', e=>{
  if(e.key==='Enter') addTask();
});

function showEmailStatus(msg){
  document.getElementById('emailStatus').textContent = msg;
}

async function draftEmailSummary(){
  const btn = document.getElementById('emailBtn');
  const openToday = tasks.filter(t=>t.date===selectedDate && !t.done);
  if(openToday.length===0){
    showEmailStatus('Nothing open on this date to summarize.');
    return;
  }
  btn.disabled = true;
  btn.textContent = 'Drafting...';
  showEmailStatus('');

  const grouped = {};
  openToday.forEach(t=>{
    const name = catInfo(t.category).name;
    grouped[name] = grouped[name] || [];
    grouped[name].push(t.priority.toUpperCase()+' — '+t.title);
  });
  const lines = Object.entries(grouped).map(([cat, items])=>
    cat+':\n'+items.map(i=>'  - '+i).join('\n')
  ).join('\n\n');

  const dateLabel = new Date(selectedDate+'T00:00:00').toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  const prompt = 'Create a Gmail draft addressed to me. Subject: "Task Summary — '+dateLabel+'". '
    + 'Body should present these open tasks grouped by business/category, clean and readable, no extra commentary:\n\n'
    + lines
    + '\n\nUse the create_draft tool to save it as a draft in Gmail.';

  try{
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-6",
        max_tokens: 1000,
        messages: [{ role: "user", content: prompt }],
        mcp_servers: [{ type: "url", url: "https://gmailmcp.googleapis.com/mcp/v1", name: "gmail-mcp" }]
      })
    });
    const data = await response.json();
    const toolResult = (data.content || []).find(b => b.type === 'mcp_tool_result');
    const toolUse = (data.content || []).find(b => b.type === 'mcp_tool_use');
    if(toolResult && !toolResult.is_error){
      showEmailStatus('Draft saved to Gmail — check your Drafts folder.');
    } else if(toolUse) {
      showEmailStatus('Sent to Gmail, but could not confirm it saved. Check your Drafts folder.');
    } else {
      const text = (data.content || []).filter(b=>b.type==='text').map(b=>b.text).join(' ');
      showEmailStatus(text ? text.slice(0,140) : 'Gmail draft could not be created. Try again.');
    }
  }catch(e){
    showEmailStatus('Failed to reach Gmail: '+e.message);
  }
  btn.disabled = false;
  btn.textContent = 'Draft Email Summary';
}

loadTasks();

if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('sw.js').catch(e=>console.error('SW registration failed', e));
  });
}
</script>
